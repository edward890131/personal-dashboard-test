<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ maximum-scale=1, user-scalable=no：用來擋 iOS Safari 聚焦小於 16px 的 input 時自動放大頁面。
         副作用：會一併停用整個 App 的雙指手動縮放（pinch-to-zoom），對可及性有影響。
         若日後遇到「無法手動縮放 / 無障礙」相關問題，從這裡找——
         替代方案是移除這兩個參數，改在手機斷點把表單 input 字級設 16px（見 styles.css .fin-input）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>Dayboard · 個人生活儀表板</title>

    <!-- 字型：保留原本 CDN 載入方式 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
